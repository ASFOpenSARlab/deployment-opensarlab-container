---
# https://docs.github.com/en/actions/publishing-packages/publishing-docker-images
name: Create and publish a Docker image

# Configures this workflow to run every time a change is pushed to the branch called `release`.
on:  # yamllint disable-line rule:truthy
  workflow_dispatch: {}

  push:
    branches: ['main', 'test']
    tags:
      - "v*.*.*"

# There is a single job in this workflow. It's configured to run on the latest available version of Ubuntu.
jobs:
  setup:
    uses: ASFOpenSARlab/osl-utils/.github/workflows/reusable-setup-env.yaml@v1.2.2
    with:
      tagname: ${{ github.ref_name }}

  build_image:
    needs:
      - setup
    uses: ASFOpenSARlab/osl-utils/.github/workflows/reusable-docker-build.yaml@v1.2.1
    with:
      image-name: ${{ github.event.repository.name }}_sar
      dockerfile: images/sar/Dockerfile

  retag_for_aws:
    # These permissions are needed to interact with GitHub's OIDC Token endpoint.
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE_NAME: ${{ github.event.repository.name }}_sar
      GHCR_IMAGE: ghcr.io/asfopensarlab/${{ github.event.repository.name }}_sar
      ECR_IMAGE: ${{ vars.CONTAINER_ECR_PREFIX }}/${{ github.event.repository.name }}_sar
    runs-on: ubuntu-latest
    needs:
      - build_image
      - setup
    steps:
      - name: AWS Login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{vars.AWS_ACCOUNT_ID}}:role/${{vars.CONTAINER_ECR_OIDC_IAM_ROLE_NAME}}
          aws-region: ${{ vars.AWS_REGION }}
          
      - name: ECR Login
        uses: aws-actions/amazon-ecr-login@v2

      # Extraneous?
      - uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # yamllint disable rule:line-length
      - name: Fetch from ghcr, retag, push to ecr
        run: |
          retags=("${{ needs.setup.outputs.deploy_prefix }}" "${{ needs.setup.outputs.shortsha }}" "${{ needs.setup.outputs.branchtag }}" "${{ needs.setup.outputs.environment }}")
          docker pull ${{ env.GHCR_IMAGE }}:${{ needs.setup.outputs.branchtag }}
          # Loop over the retags, tag + push
          for retag in "${retags[@]}"; do
            docker tag ${{ env.GHCR_IMAGE }}:${{ needs.setup.outputs.branchtag }} ${{ env.ECR_IMAGE }}:$retag
            docker push ${{ env.ECR_IMAGE }}:$retag
          done

      # This works, but rebuilds
      #- name: ECR Push
      #  uses: docker/build-push-action@v5
      #  with:
      #    file: images/sar/Dockerfile
      #    push: true
      #    pull: false
