      #      ${{ vars.CONTAINER_ECR_PREFIX }}/deployment-opensarlab-container_sar:${{ needs.setup.outputs.branchtag }}
      #      ${{ vars.CONTAINER_ECR_PREFIX }}/deployment-opensarlab-container_sar:${{ needs.setup.outputs.environment }}
